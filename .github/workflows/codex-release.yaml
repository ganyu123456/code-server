name: Build and Publish Codex code-server
on:
  push:
    tags:
      - 'codex-v*'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: 'latest'
jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - name: Set tag
        run: echo "TAG=${GITHUB_REF_NAME#codex-v}" >> $GITHUB_ENV
      - name: Build AI Agent extension
        run: |
          cd extensions/ai-agent
          npm install
          npx @vscode/vsce package --allow-missing-repository --out ../../ai-agent.vsix
          cd ../..
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.zkjgy.online
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.codex
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            harbor.zkjgy.online/library/code-server:${{ env.TAG }}-${{ matrix.runs-on == 'ubuntu-latest' && 'amd64' || 'arm64' }}

  merge-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set tag
        run: echo "TAG=${GITHUB_REF_NAME#codex-v}" >> $GITHUB_ENV
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.zkjgy.online
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t harbor.zkjgy.online/library/code-server:${{ env.TAG }} \
            -t harbor.zkjgy.online/library/code-server:latest \
            harbor.zkjgy.online/library/code-server:${{ env.TAG }}-amd64 \
            harbor.zkjgy.online/library/code-server:${{ env.TAG }}-arm64
